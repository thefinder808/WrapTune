name: Release

# Builds WrapTune.msi on Windows when a tag like v1.0.1 is pushed,
# then attaches the MSI to a matching GitHub Release.
# Idempotent: if a release for the tag already exists, uploads to it
# instead of creating a new one (lets you publish manually first).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for OIDC: lets GitHub mint a federated token Azure trusts

jobs:
  build-msi:
    runs-on: windows-latest
    # Must match the subject claim on the federated credential in Azure
    # (App Registration → Certificates & secrets → Federated credentials).
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch IntuneWinAppUtil.exe from Microsoft
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool.git tmp
          New-Item -ItemType Directory -Force -Path Installer/Bundled | Out-Null
          Copy-Item tmp/IntuneWinAppUtil.exe Installer/Bundled/IntuneWinAppUtil.exe
          Remove-Item -Recurse -Force tmp

      - name: Regenerate icon
        # Generate-Icon.ps1 uses System.Drawing which is fully available on
        # windows-latest. This keeps WrapTune.ico in sync with the script
        # (the source of truth) even if the committed .ico is stale because
        # someone authored on a non-Windows machine.
        shell: pwsh
        run: ./Generate-Icon.ps1

      - name: Build MSI
        shell: pwsh
        # Tag form: v1.2.3  ->  MSI version: 1.2.3.0
        # The trailing .0 matches .NET's 4-part AssemblyVersion/FileVersion
        # shape; MSI's MajorUpgrade comparison only looks at Major.Minor.Build
        # (the 4th field is ignored for upgrade detection).
        #
        # The version is templated into Package.wxs via WiX preprocessor and
        # also flows to WrapTune.exe's AssemblyVersion/FileVersion through
        # .NET SDK's default behavior — works because WrapTune.csproj doesn't
        # override those properties. Keeps ARP entry, file metadata, and
        # MajorUpgrade comparisons all consistent.
        #
        # The tag-shape guard below fails fast on pre-release labels
        # (e.g. v1.2.3-rc1) and tags with too many/few parts, before the
        # expensive build steps run.
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' must be of the form 'vMAJOR.MINOR.PATCH'. Pre-release labels and non-strict-SemVer tags are not supported by the MSI version pipeline."
          }
          $tagVersion = $tag -replace '^v',''
          $msiVersion = "$tagVersion.0"
          Write-Host "Building MSI for tag $tag -> version $msiVersion"
          ./Build-Installer.ps1 -Version $msiVersion

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign WrapTune.msi with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: thefinder808-signing
          certificate-profile-name: public-signing
          files: ${{ github.workspace }}/WrapTune.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Publish to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists — uploading MSI to it"
            gh release upload "$env:TAG" WrapTune.msi --clobber
          } else {
            Write-Host "Creating new release $env:TAG"
            gh release create "$env:TAG" WrapTune.msi --title "$env:TAG" --generate-notes
          }
